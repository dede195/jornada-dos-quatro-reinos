function zone(){return currentAdventure.ends.findIndex(end=>index<end)}

function speak(){const q=questions[index];speechSynthesis.cancel();const voiceText=q.speech||`${q.story||''} ${q.q}`;const utterance=new SpeechSynthesisUtterance(voiceText);utterance.lang='pt-BR';utterance.rate=.88;speechSynthesis.speak(utterance)}
function shuffleAnswers(q){return q.answers.map((text,original)=>({text,correct:original===q.correct})).sort(()=>Math.random()-.5)}
function render(){locked=false;updateProgress();const q=questions[index];currentAnswers=shuffleAnswers(q);const stageStart=zone()===0?0:currentAdventure.ends[zone()-1];const stageTotal=currentAdventure.ends[zone()]-stageStart;stage.innerHTML=`<section class="screen"><div class="question-card"><div class="location">${q.icon} ${q.place} • desafio ${index-stageStart+1} de ${stageTotal}</div>${q.story?`<div class="story">${q.story}</div>`:''}${q.visual?`<div class="question-visual" role="img" aria-label="${q.visualLabel||'Ilustração da questão'}">${q.visual}</div>`:''}${q.word?`<div class="word-card"><span class="initial-letter">${q.initial}</span><span class="animal-word">${q.word}</span></div>`:''}<div class="prompt">${q.q}</div><button class="read" id="read">🔊 ${q.speech?'Ouvir animal e letra':'Ouvir pergunta'}</button><div class="answers">${currentAnswers.map((a,i)=>`<button class="answer" data-i="${i}">${a.text}</button>`).join('')}</div><div class="feedback" id="feedback">Escolha uma resposta.</div></div></section>`;document.querySelector('#read').onclick=speak;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b,Number(b.dataset.i)))}
function answer(btn,choice){if(locked)return;const q=questions[index],fb=document.querySelector('#feedback');if(!currentAnswers[choice].correct){btn.classList.add('wrong');fb.className='feedback try';fb.textContent=`Quase! ${q.hint} Tente outra vez.`;setTimeout(()=>btn.classList.remove('wrong'),600);return}locked=true;btn.classList.add('correct');stars++;starEl.textContent=stars;fb.className='feedback good';fb.innerHTML=`🎉 ${q.ok}`;setTimeout(()=>{const isStageEnd=index===currentAdventure.ends[zone()]-1;if(isStageEnd&&index<questions.length-1){reward(zone())}else if(index===questions.length-1){finish()}else{index++;render()}},1100)}
function reward(z){stage.innerHTML=`<section class="screen"><div class="reward">${currentAdventure.rewardIcons[z]}</div><h2>${currentAdventure.rewards[z]}: conquista concluída!</h2><p>${hero} Você completou esta etapa e abriu um novo caminho.</p><button class="primary" id="next">Continuar jornada</button></section>`;document.querySelector('#next').onclick=()=>{index++;render()}}
function finish(){
 document.querySelectorAll('.step').forEach(s=>s.className='step done');
 const replayKey=Object.keys(adventures).find(key=>adventures[key]===currentAdventure);
 if(replayKey==='alphabet'){
  const stickers=alphabetQuestions.map(q=>`<div class="sticker">${q.visual}<b>${q.initial}</b></div>`).join('');
  stage.innerHTML=`<section class="screen"><div class="reward">📖✨</div><div class="final-cheer">Alfabeto completo! Parabéns! 🎉</div><div class="album">${stickers}</div><div class="cert"><h3>Guardião dos Animais</h3><p>${hero} conheceu 26 animais e conquistou <b>${stars} estrelas</b>!</p></div><button class="primary" id="again">Jogar novamente</button> <button class="secondary" id="menu">Outras aventuras</button></section>`;
 }else{
  const finals={
   forest:{className:'treasure-scene',aria:'Baú do tesouro se abrindo e revelando uma chave',scene:'<div class="treasure-glow"></div><div class="chest"><div class="chest-lid"></div><div class="chest-lock"></div></div>',cheer:'Parabéns, você é bommm! 🎉',extra:'<h2>A Chave Dourada é sua!</h2>',crystals:'💜 💙 💛',title:'Certificado de Grande Aventureiro',text:'recuperou os três cristais e salvou o Bosque das Palavras Perdidas'},
   garden:{className:'garden-scene',aria:'Jardim colorido com flores, frutas e abelhas',scene:'🌳🌈🐝<br>🌷🍎🌻🍇🌼',cheer:'Parabéns! O jardim voltou a sorrir! 🎉',crystals:'🌺 🌻 🌈',title:'Guardião das Cores e Vogais',text:'devolveu as cores ao jardim'},
   shapes:{className:'shape-scene',aria:'Castelo colorido construído com formas geométricas',scene:'🔺　🔺<br>🟨🟦🟨<br>🟧🟪🟧',cheer:'O castelo está pronto! Parabéns! 🎉',crystals:'🔵 🔺 🟨',title:'Mestre das Formas',text:'reconstruiu o castelo'},
   numbers:{className:'number-scene',aria:'Coroa dourada cercada de números e pedras brilhantes',scene:'1️⃣ 2️⃣ 3️⃣<br>💎 👑 💎<br>➕ ⭐ ➖',cheer:'A Coroa dos Números voltou a brilhar! 🎉',crystals:'💎 🔶 🔷',title:'Mestre dos Números',text:'salvou o reino dos números'},
   animals:{className:'animal-forest-scene',aria:'Floresta cheia de animais felizes em seus habitats',scene:'🌳 🐒 🐦 🌳<br>🐇 🌿 🦁 🐸<br>🌊 🐟 🐢 🌺',cheer:'Todos os animais voltaram para casa! 🎉',crystals:'🍃 🍎 🎶',title:'Protetor da Floresta',text:'ajudou todos os animais'},
   planet:{className:'planet-scene',aria:'Planeta Terra verde, limpo e cercado pela natureza',scene:'☀️　🌍　☁️<br>🌳 🐝 🌻 🐦<br>💧 ♻️ 🌱',cheer:'O planeta voltou a ficar verde! 🎉',crystals:'♻️ 💧 🌱',title:'Guardião da Natureza',text:'cuidou do planeta'},
   emotions:{className:'emotion-scene',aria:'Vila colorida com pessoas amigas e corações',scene:'🏡 😊 💛 🏡<br>🧒🏽 🤝 🧒🏻<br>🌈 💬 🌷',cheer:'A Vila das Emoções voltou a sorrir! 🎉',crystals:'💗 💬 🤝',title:'Amigo das Emoções',text:'espalhou diálogo, empatia e amizade pela vila'},
   body:{className:'body-scene',aria:'Mapa do corpo humano completo com coração, cérebro e hábitos saudáveis',scene:'🧠　🧒🏽　🫀<br>👀 👂 👃<br>🧼 🍎 🏃 😴',cheer:'O Mapa do Corpo está completo! 🎉',crystals:'🫀 ⭐ 🛡️',title:'Guardião do Corpo',text:'completou a expedição e aprendeu a cuidar do corpo'},
   play:{className:'play-scene',aria:'Parque colorido com crianças brincando juntas',scene:'☀️　🪁　🎈<br>🧒🏽 ➰ 🧒🏻 ⚽ 🧒🏾<br>1️⃣ 2️⃣ 3️⃣　🤝',cheer:'As risadas voltaram ao parque! 🎉',crystals:'🪁 🏅 🤝',title:'Mestre das Brincadeiras',text:'espalhou movimento, cooperação e jogo justo pelo parque'}
  };
  const f=finals[replayKey];
  stage.innerHTML=`<section class="screen"><div class="${f.className}" role="img" aria-label="${f.aria}">${f.scene}</div><div class="final-cheer">${f.cheer}</div>${f.extra||''}<div class="cert"><div class="crystals">${f.crystals}</div><h3>${f.title}</h3><p>${hero} ${f.text} e conquistou <b>${stars} estrelas</b>!</p></div><button class="primary" id="again">Jogar novamente</button> <button class="secondary" id="menu">Outras aventuras</button></section>`;
 }
 document.querySelector('#again').onclick=()=>selectAdventure(replayKey);
 document.querySelector('#menu').onclick=adventureMenu;
}
adventureMenu();
</script>
