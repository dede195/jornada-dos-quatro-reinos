function playApplause(){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx;[0,.1,.2,.34].forEach(delay=>{const length=Math.floor(ctx.sampleRate*.075),buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=buffer;filter.type='bandpass';filter.frequency.value=1400;filter.Q.value=.7;gain.gain.setValueAtTime(.001,ctx.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.32,ctx.currentTime+delay+.008);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+delay+.075);source.connect(filter).connect(gain).connect(ctx.destination);source.start(ctx.currentTime+delay)});setTimeout(()=>ctx.close(),900)}
