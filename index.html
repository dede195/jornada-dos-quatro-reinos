<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A Jornada dos Quatro Reinos</title>
  <style>
    :root{--ink:#283044;--purple:#7057d9;--yellow:#ffd65a;--green:#48b783;--pink:#ef6f91;--paper:#fffdf7}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 8%,#fff7b9 0 8%,transparent 9%),linear-gradient(145deg,#bdebf2,#d9ccff 55%,#ffd9ae);padding:20px}
    button{font:inherit}.game{width:min(920px,100%);margin:auto;background:rgba(255,253,247,.96);border:5px solid #fff;border-radius:30px;box-shadow:0 20px 50px #46506b33;overflow:hidden}
    header{padding:20px 24px 14px;background:#fff;display:flex;gap:18px;align-items:center;justify-content:space-between;border-bottom:3px dashed #ded7f8}.brand{display:flex;align-items:center;gap:12px}.crest{font-size:42px}.brand h1{font-size:clamp(20px,4vw,30px);margin:0;color:#5743ad}.brand p{margin:3px 0 0;font-weight:bold;color:#6b7280}.score{background:#fff4bc;border:2px solid #f1c847;padding:9px 14px;border-radius:999px;font-weight:bold;white-space:nowrap}
    .progress{padding:15px 24px;background:#f7f4ff;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.step{text-align:center;border-radius:14px;padding:9px 5px;background:#e5e0f8;color:#716d7e;font-weight:bold}.step.active{background:#7057d9;color:#fff;box-shadow:0 5px 0 #4e3ba6}.step.done{background:#bdebcf;color:#276641}
    main{padding:clamp(22px,5vw,48px);min-height:500px;display:grid;place-items:center}.screen{width:min(680px,100%);text-align:center}.hero{font-size:74px;filter:drop-shadow(0 7px 0 #e8ddbb)}h2{font-size:clamp(28px,6vw,46px);margin:8px 0;color:#4f3da4}p{font-size:19px;line-height:1.5}.story{background:#fff5d7;border:2px solid #f0d47a;border-radius:18px;padding:16px;margin:22px 0}.characters{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:22px 0}.char{border:3px solid #d8d0f2;background:#fff;border-radius:20px;padding:12px 20px;cursor:pointer;font-size:42px;min-width:105px;transition:.15s}.char span{display:block;font-size:15px;font-weight:bold;margin-top:5px}.char:hover,.char.selected{transform:translateY(-4px);border-color:var(--purple);background:#f0edff;box-shadow:0 7px 0 #d3c9f2}
    .primary,.answer,.secondary{border:0;border-radius:16px;padding:14px 22px;font-weight:bold;cursor:pointer;transition:.15s}.primary{background:var(--purple);color:#fff;font-size:20px;box-shadow:0 6px 0 #49389f}.primary:hover{transform:translateY(-2px)}.primary:active{transform:translateY(4px);box-shadow:0 2px 0 #49389f}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e9e5f8;color:#54459a}.question-card{background:#fff;border:3px solid #e6def7;border-radius:24px;padding:24px;box-shadow:0 10px 0 #eee9f5}.location{color:#755ecb;font-weight:bold;text-transform:uppercase;letter-spacing:.08em}.prompt{font-size:clamp(23px,4vw,32px);font-weight:bold;margin:18px 0}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:22px}.answer{background:#f4f1ff;border:3px solid #cfc5ef;color:#44357e;font-size:20px}.answer:hover{background:#e8e2ff;transform:translateY(-2px)}.answer.correct{background:#c8f4d8;border-color:#48b783;color:#21633e}.answer.wrong{background:#ffe0e7;border-color:#ef6f91;color:#8c3150}.feedback{min-height:58px;margin:18px 0 6px;font-weight:bold;font-size:18px}.good{color:#238050}.try{color:#b53f62}.read{border:0;background:#e8f6ff;color:#28637d;border-radius:999px;padding:9px 14px;font-weight:bold;cursor:pointer}.reward{font-size:75px;animation:pop .7s ease}.cert{background:linear-gradient(145deg,#fff9d9,#fff);border:5px double #e7b928;border-radius:24px;padding:25px;margin:20px 0}.crystals{font-size:46px;letter-spacing:8px}@keyframes pop{50%{transform:scale(1.25) rotate(8deg)}}
    .question-visual{font-size:88px;line-height:1;margin:18px 0 4px;filter:drop-shadow(0 7px 0 #eee8d7);animation:float 2.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}
    .treasure-scene{height:155px;position:relative;margin:5px auto 12px;width:220px}.treasure-glow{position:absolute;left:50%;top:55px;width:150px;height:80px;transform:translateX(-50%);background:radial-gradient(ellipse,#fff5a8 0,#ffd54a99 45%,transparent 72%);animation:shine 1.4s ease-in-out infinite}.chest{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:150px;height:75px;background:linear-gradient(#b96728,#7e3d19);border:6px solid #5b2c17;border-radius:9px 9px 18px 18px;box-shadow:0 10px 0 #e9dfbd}.chest:after{content:'🔑';position:absolute;font-size:52px;left:46px;top:-70px;animation:keyRise 1.1s .35s both}.chest-lid{position:absolute;left:-6px;top:-36px;width:150px;height:43px;background:linear-gradient(#dc8a36,#9b4f20);border:6px solid #5b2c17;border-radius:65px 65px 5px 5px;transform-origin:left bottom;animation:openLid 1s .15s both}.chest-lock{position:absolute;z-index:2;left:58px;top:8px;width:25px;height:31px;background:#ffd653;border:4px solid #754b10;border-radius:4px}.final-cheer{font-size:clamp(25px,5vw,38px);font-weight:900;color:#e05278;margin:5px 0;animation:pop .8s .8s both}@keyframes openLid{to{transform:rotate(-24deg) translate(-5px,-17px)}}@keyframes keyRise{from{opacity:0;transform:translateY(45px) scale(.5)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes shine{50%{transform:translateX(-50%) scale(1.18);opacity:.65}}
    footer{text-align:center;padding:12px;color:#6d7180;font-size:13px}@media(max-width:560px){body{padding:8px}.game{border-radius:20px}header{padding:14px}.brand p{display:none}.progress{padding:10px}.step{font-size:12px}main{padding:22px 15px}.question-card{padding:18px}.score{font-size:14px}}
  </style>
</head>
<body>
<div class="game">
  <header><div class="brand"><div class="crest">🏰</div><div><h1>A Jornada dos Quatro Reinos</h1><p>O Bosque das Palavras Perdidas</p></div></div><div class="score">⭐ <span id="stars">0</span> estrelas</div></header>
  <div class="progress" id="progress"><div class="step">🌉 Palavras</div><div class="step">🌊 Números</div><div class="step">🕯️ Enigmas</div></div>
  <main id="stage"></main><footer>Feito para aprender brincando • 2º e 3º ano</footer>
</div>
<script>
const questions=[
 {place:'Ponte das Sílabas',icon:'🌉',visual:'🏠',visualLabel:'Figura de uma casa',q:'Organize as sílabas SA — CA.',answers:['SACA','CASA','ASCA'],correct:1,hint:'Dica: é o lugar onde moramos.',ok:'Muito bem! Você formou CASA.'},
 {place:'Ponte das Sílabas',icon:'🐱',visual:'🐈',q:'Qual palavra combina com este animal?',answers:['PATO','GATO','MATO'],correct:1,hint:'Dica: começa com a letra G.',ok:'Isso! A palavra é GATO.'},
 {place:'Ponte das Sílabas',icon:'⚽',visual:'⚽',visualLabel:'Figura de uma bola',q:'Complete: BO + ___ = BOLA',answers:['LO','LA','LE'],correct:1,hint:'Dica: fale BOLA bem devagar.',ok:'Perfeito! BO + LA forma BOLA.'},
 {place:'Lago dos Números',icon:'🍎',q:'Ana tinha 5 maçãs e ganhou mais 3. Quantas ela tem agora?',answers:['7','8','9'],correct:1,hint:'Dica: conte 5... 6, 7, 8.',ok:'Isso mesmo! 5 + 3 = 8.'},
 {place:'Lago dos Números',icon:'🐟',q:'Complete: 2, 4, 6, ___, 10',answers:['7','8','9'],correct:1,hint:'Dica: os números aumentam de 2 em 2.',ok:'Excelente! Depois do 6 vem o 8.'},
 {place:'Lago dos Números',icon:'🐠',q:'12 peixes foram divididos igualmente em 3 aquários. Quantos ficaram em cada um?',answers:['3','4','5'],correct:1,hint:'Dica: distribua um peixe por vez nos 3 aquários.',ok:'Mandou bem! 12 dividido por 3 é 4.'},
 {place:'Caverna dos Enigmas',icon:'💎',story:'Léo encontrou 4 pedras brilhantes perto do rio. Depois, Bia encontrou mais 5 pedras.',q:'Quem encontrou as pedras primeiro?',answers:['Bia','Léo','Os dois juntos'],correct:1,hint:'Dica: observe a primeira frase.',ok:'Correto! Léo encontrou primeiro.'},
 {place:'Caverna dos Enigmas',icon:'➕',story:'Léo encontrou 4 pedras brilhantes perto do rio. Depois, Bia encontrou mais 5 pedras.',q:'Quantas pedras eles encontraram juntos?',answers:['8','9','10'],correct:1,hint:'Dica: some 4 + 5.',ok:'Muito bem! Juntos encontraram 9.'},
 {place:'Caverna dos Enigmas',icon:'🏞️',story:'Léo encontrou 4 pedras brilhantes perto do rio. Depois, Bia encontrou mais 5 pedras.',q:'Onde Léo encontrou as pedras?',answers:['Na escola','Perto do rio','Na floresta'],correct:1,hint:'Dica: volte à primeira frase.',ok:'Isso! Foi perto do rio.'}
];
let index=0,stars=0,hero='',locked=false,currentAnswers=[];
const stage=document.querySelector('#stage'), starEl=document.querySelector('#stars');
function intro(){document.querySelector('#progress').style.visibility='hidden';stage.innerHTML=`<section class="screen"><div class="hero">🌳📖</div><h2>O Bosque das Palavras Perdidas</h2><div class="story">Neblino embaralhou as palavras do bosque e escondeu a Chave Dourada. Escolha seu aventureiro e recupere os três cristais!</div><div class="characters"><button class="char" data-hero="🧙🏽"><b>🧙🏽</b><span>Lumi</span></button><button class="char" data-hero="🦸🏾‍♀️"><b>🦸🏾‍♀️</b><span>Bela</span></button><button class="char" data-hero="🧝🏻"><b>🧝🏻</b><span>Nilo</span></button></div><button class="primary" id="start" disabled>Começar aventura</button></section>`;document.querySelectorAll('.char').forEach(b=>b.onclick=()=>{hero=b.dataset.hero;document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.querySelector('#start').disabled=false});document.querySelector('#start').onclick=()=>{document.querySelector('#progress').style.visibility='visible';render()}}
function zone(){return Math.floor(index/3)}
function updateProgress(){document.querySelectorAll('.step').forEach((s,i)=>{s.className='step '+(i<zone()?'done':i===zone()?'active':'')})}
function speak(){const q=questions[index];speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(`${q.story||''} ${q.q}`))}
function shuffleAnswers(q){return q.answers.map((text,original)=>({text,correct:original===q.correct})).sort(()=>Math.random()-.5)}
function render(){locked=false;updateProgress();const q=questions[index];currentAnswers=shuffleAnswers(q);stage.innerHTML=`<section class="screen"><div class="question-card"><div class="location">${q.icon} ${q.place} • desafio ${index%3+1} de 3</div>${q.story?`<div class="story">${q.story}</div>`:''}${q.visual?`<div class="question-visual" role="img" aria-label="${q.visualLabel||'Figura de um gato'}">${q.visual}</div>`:''}<div class="prompt">${q.q}</div><button class="read" id="read">🔊 Ouvir pergunta</button><div class="answers">${currentAnswers.map((a,i)=>`<button class="answer" data-i="${i}">${a.text}</button>`).join('')}</div><div class="feedback" id="feedback">Escolha uma resposta.</div></div></section>`;document.querySelector('#read').onclick=speak;document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(b,Number(b.dataset.i)))}
function answer(btn,choice){if(locked)return;const q=questions[index],fb=document.querySelector('#feedback');if(!currentAnswers[choice].correct){btn.classList.add('wrong');fb.className='feedback try';fb.textContent=`Quase! ${q.hint} Tente outra vez.`;setTimeout(()=>btn.classList.remove('wrong'),600);return}locked=true;btn.classList.add('correct');stars++;starEl.textContent=stars;fb.className='feedback good';fb.innerHTML=`🎉 ${q.ok}`;setTimeout(()=>{if(index===2||index===5){reward(zone());}else if(index===8){finish()}else{index++;render()}},1100)}
function reward(z){const names=['Cristal das Palavras','Cristal dos Números'];const icons=['💜','💙'];stage.innerHTML=`<section class="screen"><div class="reward">${icons[z]}</div><h2>${names[z]} conquistado!</h2><p>${hero} Você completou esta etapa e abriu um novo caminho.</p><button class="primary" id="next">Continuar jornada</button></section>`;document.querySelector('#next').onclick=()=>{index++;render()}}
function finish(){document.querySelectorAll('.step').forEach(s=>s.className='step done');stage.innerHTML=`<section class="screen"><div class="treasure-scene" role="img" aria-label="Baú do tesouro se abrindo e revelando uma chave"><div class="treasure-glow"></div><div class="chest"><div class="chest-lid"></div><div class="chest-lock"></div></div></div><div class="final-cheer">Parabéns, você é bommm! 🎉</div><h2>A Chave Dourada é sua!</h2><div class="cert"><div class="crystals">💜 💙 💛</div><h3>Certificado de Grande Aventureiro</h3><p>${hero} recuperou os três cristais com <b>${stars} estrelas</b> e salvou o Bosque das Palavras Perdidas!</p></div><button class="primary" id="again">Jogar novamente</button></section>`;document.querySelector('#again').onclick=()=>{index=0;stars=0;hero='';starEl.textContent=0;intro()}}
intro();
</script>
</body>
</html>
